name: Build hydra for Windows
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-libssh
            mingw-w64-ucrt-x86_64-postgresql
            mingw-w64-ucrt-x86_64-libmariadbclient
            mingw-w64-ucrt-x86_64-libgcrypt
            mingw-w64-ucrt-x86_64-libidn2
            mingw-w64-ucrt-x86_64-pcre2
            openssl-devel libgcrypt-devel libidn-devel
            subversion apr-devel apr-util-devel
            mingw-w64-ucrt-x86_64-ntldd-git
      - name: Build
        run: |
          ./configure --disable-xhydra
          make -j$(nproc)
      - name: Bundle DLLs
        run: |
          dest="${{ github.workspace }}/dist"
          mkdir -p "$dest"
          cp hydra.exe "$dest/"
          /mingw64/bin/ntldd.exe -R hydra.exe | grep -iv WINDOWS | \
            grep -v "not found" | cut -d '>' -f 2 | sed 's/.*) //' | \
            grep -v '^$' | xargs -I {} cp "{}" "$dest/"
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: hydra-windows-x64
          path: dist/

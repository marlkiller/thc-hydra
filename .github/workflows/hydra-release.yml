name: Build Windows (MSYS2)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS          # ← 关键：用 MSYS 不是 MINGW64
          update: true
          install: >-
            gcc
            make
            autoconf
            automake
            pkg-config
            zlib-devel
            openssl-devel
            libssh-devel
            pcre2-devel
            libidn-devel
            ncurses-devel
            libcrypt-devel

      - name: Configure
        run: ./configure

      - name: Build
        run: make -j$(nproc)

      - name: Collect
        run: |
          mkdir dist
          cp hydra.exe pw-inspector.exe dist/ 2>/dev/null || true
          # 收集依赖的 msys DLL
          ldd hydra.exe | grep msys | awk '{print $3}' | xargs -I{} cp {} dist/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: hydra-windows-msys2
          path: dist/

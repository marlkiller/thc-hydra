name: Build Windows (MSYS2)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: >-
            gcc
            make
            autoconf
            automake
            pkg-config
            zlib
            zlib-devel
            libopenssl
            openssl-devel
            libssh
            libssh-devel
            pcre2
            pcre2-devel
            libidn
            libidn-devel
            ncurses
            ncurses-devel
            libgcrypt
            libgcrypt-devel
            libgpg-error
            libgpg-error-devel
            libcrypt-devel
            msys2-runtime

      - name: Configure
        run: ./configure

      - name: Build
        run: make -j$(nproc)

      - name: Collect artifacts
        run: |
          set -e  # 先关掉，避免任何非零退出杀死脚本
          set +e

          mkdir -p dist
          cp hydra.exe dist/ 2>/dev/null || true
          cp pw-inspector.exe dist/ 2>/dev/null || true

          for pkg in \
            libssh \
            libopenssl \
            zlib \
            pcre2 \
            libidn \
            ncurses \
            libgcrypt \
            libgpg-error \
          ; do
            pacman -Ql "$pkg" 2>/dev/null \
              | awk '{print $2}' \
              | grep '^/usr/bin/msys-.*\.dll$' \
              | while read f; do
                  [ -f "$f" ] && cp "$f" dist/ && echo "Copied: $f"
                done
          done

          cp /usr/bin/msys-2.0.dll dist/ 2>/dev/null || true
          cp /usr/bin/msys-crypt-2.dll dist/ 2>/dev/null || true
          cp /usr/bin/msys-gcc_s-seh-1.dll dist/ 2>/dev/null || true
          cp /usr/bin/msys-iconv-2.dll dist/ 2>/dev/null || true
          cp /usr/bin/msys-intl-8.dll dist/ 2>/dev/null || true

          echo "=== dist contents ==="
          ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hydra-windows-msys2
          path: dist/
          retention-days: 30

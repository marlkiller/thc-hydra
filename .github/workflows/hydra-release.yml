name: Build Windows (MSYS2)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS          # ← 关键：用 MSYS 不是 MINGW64
          update: true
          install: >-
            gcc
            make
            autoconf
            automake
            pkg-config
            zlib-devel
            openssl-devel
            libssh-devel
            pcre2-devel
            libidn-devel
            ncurses-devel
            libcrypt-devel

      - name: Configure
        run: ./configure

      - name: Build
        run: make -j$(nproc)

      - name: Collect
        run: |
          mkdir dist
          cp hydra.exe pw-inspector.exe dist/ 2>/dev/null || true
          cp /usr/bin/msys-2.0.dll dist/
          cp /usr/bin/msys-ssl-3.dll dist/ 2>/dev/null || true
          cp /usr/bin/msys-crypto-3.dll dist/ 2>/dev/null || true
          cp /usr/bin/msys-ssh-4.dll dist/ 2>/dev/null || true
          cp /usr/bin/msys-intl-8.dll dist/ 2>/dev/null || true
          cp /usr/bin/msys-iconv-2.dll dist/ 2>/dev/null || true
          cp /usr/bin/msys-z.dll dist/ 2>/dev/null || true
          cp /usr/bin/msys-idn2-0.dll dist/ 2>/dev/null || true
          cp /usr/bin/msys-gcrypt-20.dll dist/ 2>/dev/null || true
          cp /usr/bin/msys-gpg-error-0.dll dist/ 2>/dev/null || true
          cp /usr/bin/msys-ncursesw6.dll dist/ 2>/dev/null || true
          cp /usr/bin/msys-pcre2-8-0.dll dist/ 2>/dev/null || true
          cp /usr/bin/msys-unistring-5.dll dist/ 2>/dev/null || true
          cp /usr/bin/msys-gmp-10.dll dist/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: hydra-windows-msys2
          path: dist/

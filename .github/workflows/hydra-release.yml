name: Build Windows (MSYS2)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: >-
            gcc
            make
            autoconf
            automake
            pkg-config
            zlib-devel
            openssl-devel
            libssh-devel
            pcre2-devel
            libidn-devel
            ncurses-devel
            libgcrypt-devel
            libgpg-error-devel
            libcrypt-devel
      - name: Debug ssh dll
        run: |
          # 确认 libssh 的 dll 实际叫什么
          pacman -Ql libssh | grep dll
          # 确认文件存在
          find /usr/bin -name "*ssh*"
          
      - name: Configure
        run: ./configure

      - name: Build
        run: make -j$(nproc)

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp hydra.exe dist/ 2>/dev/null || true
          cp pw-inspector.exe dist/ 2>/dev/null || true
      
          # ldd 递归收集（workflow 里 msys2 shell 有 ldd）
          ldd hydra.exe | awk '{print $3}' | grep '^/usr/bin' | while read f; do
            cp "$f" dist/ 2>/dev/null || true
            ldd "$f" 2>/dev/null | awk '{print $3}' | grep '^/usr/bin' | while read f2; do
              cp "$f2" dist/ 2>/dev/null || true
            done
          done
      
          # 强制补上 libssh（不管叫什么名字）
          pacman -Ql libssh | grep '/usr/bin.*\.dll' | awk '{print $2}' | while read f; do
            echo "Force copy libssh dll: $f"
            cp "$f" dist/ 2>/dev/null || true
          done
      
          echo "=== ldd result ==="
          ldd hydra.exe
      
          echo "=== dist ==="
          ls dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hydra-windows-msys2
          path: dist/
          retention-days: 30
